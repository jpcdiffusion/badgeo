<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
  <title>Pointeuse</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:#0c0c14;color:#e8e6f0;font-family:'DM Sans','Segoe UI',sans-serif}
    input[type=time],input[type=text],input[type=number]{color-scheme:dark}
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
const { useState, useEffect, useCallback } = React;
const JOURS = ["Lun","Mar","Mer","Jeu","Ven","Sam","Dim"];
const JOURS_FULL = ["Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi","Dimanche"];
const MOIS = ["Janvier","Février","Mars","Avril","Mai","Juin","Juillet","Août","Septembre","Octobre","Novembre","Décembre"];
const TYPE_SPECIAL = { repos:"Repos", ferie:"Férié" };
const CRENEAUX = [
  { label:"Arrivée matin",  field:"matin_debut", icon:"🌅", color:"#4ade80" },
  { label:"Départ matin",   field:"matin_fin",   icon:"☀️",  color:"#facc15" },
  { label:"Arrivée soir",   field:"soir_debut",  icon:"🌆", color:"#60a5fa" },
  { label:"Départ soir",    field:"soir_fin",    icon:"🌙", color:"#c4b8ff" },
];
function dateKey(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }
function parseKey(k){ const [y,m,d]=k.split("-").map(Number); return new Date(y,m-1,d); }
function minutesToHM(min){ if(min<0) return `-${minutesToHM(-min)}`; const h=Math.floor(min/60),m=min%60; return `${h}h${String(m).padStart(2,"0")}`; }
function hmToMinutes(hm){ if(!hm) return null; const p=hm.split(":"); return (parseInt(p[0])||0)*60+(parseInt(p[1])||0); }
function displayHeure(hm){ if(!hm) return "—"; const h=parseInt(hm.split(":")[0]),m=hm.split(":")[1]; if(h>=24) return `${String(h-24).padStart(2,"0")}:${m}†`; return hm; }
function getWeekStart(d){ const dt=new Date(d),day=dt.getDay(),diff=day===0?-6:1-day; dt.setDate(dt.getDate()+diff); dt.setHours(0,0,0,0); return dt; }
function calcJour(entry){ if(!entry||entry.special) return 0; let t=0; const md=hmToMinutes(entry.matin_debut),mf=hmToMinutes(entry.matin_fin); if(md!==null&&mf!==null&&mf>md) t+=mf-md; const sd=hmToMinutes(entry.soir_debut); let sf=hmToMinutes(entry.soir_fin); if(sd!==null&&sf!==null){ if(sf<sd) sf+=24*60; if(sf>sd) t+=sf-sd; } return t; }
function nextCreneauIndex(entry){ if(!entry) return 0; for(let i=0;i<CRENEAUX.length;i++){ if(!entry[CRENEAUX[i].field]) return i; } return -1; }
function getSemaineDays(ref){ const ws=getWeekStart(ref); return Array.from({length:7},(_,i)=>{ const d=new Date(ws); d.setDate(ws.getDate()+i); return d; }); }

function DayEditor({dk,data,settings,onSave,onDelete,onClose}){
  const d=parseKey(dk),jourNom=JOURS_FULL[(d.getDay()+6)%7];
  const [local,setLocal]=useState({...(data[dk]||{})});
  const setSpecial=type=>setLocal(prev=>prev.special===type?{}:{special:type});
  const upd=(field,val)=>setLocal(prev=>{ const n={...prev,special:undefined}; if(val) n[field]=val; else delete n[field]; return n; });
  const handleSave=()=>{ const c={...local}; Object.keys(c).forEach(k=>{if(!c[k])delete c[k]}); onSave(dk,c); onClose(); };
  const total=calcJour(local);
  return (
    <div style={S.overlay} onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div style={S.modal}>
        <div style={S.modalHeader}>
          <div><div style={S.modalDay}>{jourNom}</div><div style={S.modalDate}>{d.getDate()} {MOIS[d.getMonth()]} {d.getFullYear()}</div></div>
          <button style={S.closeBtn} onClick={onClose}>✕</button>
        </div>
        <div style={S.specialRow}>
          {Object.entries(TYPE_SPECIAL).map(([k,v])=>(
            <button key={k} style={{...S.specialBtn,...(local.special===k?S.specialBtnOn:{})}} onClick={()=>setSpecial(k)}>{v}</button>
          ))}
        </div>
        {!local.special&&(<>
          <div style={S.creneauxGrid}>
            <div style={S.creneauGroup}>
              <div style={S.creneauGroupTitle}>🌅 Matin</div>
              <label style={S.lbl}>Arrivée<input type="time" style={S.tInput} value={local.matin_debut||""} onChange={e=>upd("matin_debut",e.target.value)}/></label>
              <label style={S.lbl}>Départ<input type="time" style={S.tInput} value={local.matin_fin||""} onChange={e=>upd("matin_fin",e.target.value)}/></label>
            </div>
            <div style={S.creneauGroup}>
              <div style={S.creneauGroupTitle}>🌆 Soir</div>
              <label style={S.lbl}>Arrivée<input type="time" style={S.tInput} value={local.soir_debut||""} onChange={e=>upd("soir_debut",e.target.value)}/></label>
              <label style={S.lbl}><span>Départ <span style={{fontSize:9,color:"#666"}}>†minuit: 25:30</span></span><input type="text" placeholder="01:30 ou 25:30" style={S.tInput} value={local.soir_fin||""} onChange={e=>upd("soir_fin",e.target.value)}/></label>
            </div>
          </div>
          {total>0&&<div style={S.totalJour}>Total : <strong>{minutesToHM(total)}</strong></div>}
        </>)}
        <div style={S.modalFooter}>
          {data[dk]&&<button style={S.deleteBtn} onClick={()=>{onDelete(dk);onClose();}}>Supprimer</button>}
          <button style={S.saveBtn} onClick={handleSave}>Enregistrer</button>
        </div>
      </div>
    </div>
  );
}

function VueSemaine({currentDate,setCurrentDate,data,settings,setEditDay}){
  const today=new Date(),todayKey=dateKey(today),days=getSemaineDays(currentDate);
  const total=days.reduce((a,d)=>a+calcJour(data[dateKey(d)]),0),solde=total-settings.heuresHebdo*60;
  const ws=getWeekStart(currentDate),we=new Date(ws); we.setDate(ws.getDate()+6);
  return (
    <div style={S.viewContainer}>
      <div style={S.navRow}>
        <button style={S.navBtn} onClick={()=>{const d=new Date(currentDate);d.setDate(d.getDate()-7);setCurrentDate(d);}}>‹</button>
        <div style={S.navTitle}>{ws.getDate()} {MOIS[ws.getMonth()].slice(0,3)} – {we.getDate()} {MOIS[we.getMonth()].slice(0,3)} {we.getFullYear()}</div>
        <button style={S.navBtn} onClick={()=>{const d=new Date(currentDate);d.setDate(d.getDate()+7);setCurrentDate(d);}}>›</button>
      </div>
      <div style={S.daysGrid}>
        {days.map(d=>{
          const dk=dateKey(d),entry=data[dk],mins=calcJour(entry),isToday=dk===todayKey,isSpecial=entry?.special,nxt=nextCreneauIndex(entry);
          return (
            <div key={dk} style={{...S.dayCard,...(isToday?S.dayCardToday:{}),...(isSpecial?S.dayCardSpecial:{})}} onClick={()=>setEditDay(dk)}>
              <div style={S.dayName}>{JOURS[(d.getDay()+6)%7]}</div>
              <div style={S.dayNum}>{d.getDate()}</div>
              {isSpecial?<div style={S.specialTag}>{entry.special==="repos"?"R":"F"}</div>:mins>0?<div style={S.dayHours}>{minutesToHM(mins)}</div>:nxt>0&&nxt<4?<div style={{...S.dayHours,color:"#facc15"}}>…</div>:<div style={S.dayEmpty}>—</div>}
            </div>
          );
        })}
      </div>
      <div style={S.summaryCard}>
        <div style={S.summaryRow}><span>Total semaine</span><strong>{minutesToHM(total)}</strong></div>
        <div style={S.summaryRow}><span>Forfait</span><span>{settings.heuresHebdo}h00</span></div>
        <div style={{...S.summaryRow,...S.soldeRow}}><span>Solde</span><strong style={{color:solde>=0?"#4ade80":"#f87171"}}>{solde>=0?"+":""}{minutesToHM(solde)}</strong></div>
      </div>
    </div>
  );
}

function VueMois({currentDate,setCurrentDate,data,settings,setEditDay}){
  const today=new Date(),todayKey=dateKey(today),y=currentDate.getFullYear(),mo=currentDate.getMonth();
  const total=Object.entries(data).reduce((a,[k,v])=>{const d=parseKey(k);return(d.getFullYear()===y&&d.getMonth()===mo)?a+calcJour(v):a;},0);
  const dim=new Date(y,mo+1,0).getDate(),sem=Math.ceil((dim+(new Date(y,mo,1).getDay()+6)%7)/7);
  const forfait=settings.heuresHebdo*60*sem,solde=total-forfait;
  const firstDay=(new Date(y,mo,1).getDay()+6)%7,cells=[];
  for(let i=0;i<firstDay;i++) cells.push(null);
  for(let i=1;i<=dim;i++) cells.push(new Date(y,mo,i));
  return (
    <div style={S.viewContainer}>
      <div style={S.navRow}>
        <button style={S.navBtn} onClick={()=>{const d=new Date(currentDate);d.setDate(1);d.setMonth(d.getMonth()-1);setCurrentDate(d);}}>‹</button>
        <div style={S.navTitle}>{MOIS[mo]} {y}</div>
        <button style={S.navBtn} onClick={()=>{const d=new Date(currentDate);d.setDate(1);d.setMonth(d.getMonth()+1);setCurrentDate(d);}}>›</button>
      </div>
      <div style={S.calGrid}>
        {JOURS.map(j=><div key={j} style={S.calHeader}>{j}</div>)}
        {cells.map((d,i)=>{
          if(!d) return <div key={`e${i}`}/>;
          const dk=dateKey(d),entry=data[dk],mins=calcJour(entry),isToday=dk===todayKey,isSpecial=entry?.special;
          return (
            <div key={dk} style={{...S.calCell,...(isToday?S.calCellToday:{}),...(isSpecial?S.calCellSpecial:{})}} onClick={()=>setEditDay(dk)}>
              <div style={S.calDay}>{d.getDate()}</div>
              {isSpecial?<div style={S.calSpecialTag}>{entry.special==="repos"?"R":"F"}</div>:mins>0?<div style={S.calHours}>{minutesToHM(mins)}</div>:null}
            </div>
          );
        })}
      </div>
      <div style={S.summaryCard}>
        <div style={S.summaryRow}><span>Total mois</span><strong>{minutesToHM(total)}</strong></div>
        <div style={S.summaryRow}><span>Forfait ({sem} sem.)</span><span>{minutesToHM(forfait)}</span></div>
        <div style={{...S.summaryRow,...S.soldeRow}}><span>Solde</span><strong style={{color:solde>=0?"#4ade80":"#f87171"}}>{solde>=0?"+":""}{minutesToHM(solde)}</strong></div>
      </div>
    </div>
  );
}

function VueAnnee({currentDate,setCurrentDate,data,settings,setCurrentDateAndView}){
  const y=currentDate.getFullYear();
  const totalAnnee=Object.entries(data).reduce((a,[k,v])=>parseKey(k).getFullYear()===y?a+calcJour(v):a,0);
  const forfait=settings.heuresHebdo*60*52,solde=totalAnnee-forfait;
  return (
    <div style={S.viewContainer}>
      <div style={S.navRow}>
        <button style={S.navBtn} onClick={()=>{const d=new Date(currentDate);d.setFullYear(d.getFullYear()-1);setCurrentDate(d);}}>‹</button>
        <div style={S.navTitle}>{y}</div>
        <button style={S.navBtn} onClick={()=>{const d=new Date(currentDate);d.setFullYear(d.getFullYear()+1);setCurrentDate(d);}}>›</button>
      </div>
      <div style={S.moisGrid}>
        {MOIS.map((m,i)=>{
          const tot=Object.entries(data).reduce((a,[k,v])=>{const d=parseKey(k);return(d.getFullYear()===y&&d.getMonth()===i)?a+calcJour(v):a;},0);
          const j=Object.keys(data).filter(k=>{const d=parseKey(k);return d.getFullYear()===y&&d.getMonth()===i&&!data[k].special&&calcJour(data[k])>0;}).length;
          return (
            <div key={m} style={S.moisCard} onClick={()=>setCurrentDateAndView(new Date(y,i,1),"mois")}>
              <div style={S.moisNom}>{m.slice(0,3)}</div>
              <div style={S.moisHours}>{minutesToHM(tot)}</div>
              <div style={S.moisJours}>{j}j</div>
            </div>
          );
        })}
      </div>
      <div style={S.summaryCard}>
        <div style={S.summaryRow}><span>Total année</span><strong>{minutesToHM(totalAnnee)}</strong></div>
        <div style={S.summaryRow}><span>Forfait (52 sem.)</span><span>{minutesToHM(forfait)}</span></div>
        <div style={{...S.summaryRow,...S.soldeRow}}><span>Solde</span><strong style={{color:solde>=0?"#4ade80":"#f87171"}}>{solde>=0?"+":""}{minutesToHM(solde)}</strong></div>
      </div>
    </div>
  );
}

function VueSettings({settings,updateSettings,exportCSV,exportPDF,resetData,showToast}){
  const [local,setLocal]=useState({...settings});
  return (
    <div style={S.viewContainer}>
      <div style={S.settingsSection}>
        <div style={S.settingsTitle}>⚙️ Paramètres</div>
        <label style={S.settingsLabel}>Prénom / Nom<input style={S.settingsInput} value={local.nom||""} onChange={e=>setLocal({...local,nom:e.target.value})} placeholder="ex. Thomas"/></label>
        <label style={S.settingsLabel}>Forfait hebdomadaire (h)<input style={S.settingsInput} type="number" min="1" max="80" value={local.heuresHebdo} onChange={e=>setLocal({...local,heuresHebdo:Number(e.target.value)})}/></label>
        <button style={S.saveBtn} onClick={()=>{updateSettings(local);showToast("Paramètres enregistrés ✓");}}>Enregistrer</button>
      </div>
      <div style={S.settingsSection}>
        <div style={S.settingsTitle}>📤 Export</div>
        <button style={S.exportBtn} onClick={exportCSV}>Exporter CSV</button>
        <button style={{...S.exportBtn,marginTop:8}} onClick={exportPDF}>Exporter / Imprimer PDF</button>
      </div>
      <div style={S.settingsSection}>
        <div style={S.settingsTitle}>⚠️ Danger</div>
        <button style={S.dangerBtn} onClick={resetData}>Effacer toutes les données</button>
      </div>
    </div>
  );
}

function Pointeuse(){
  const [view,setView]=useState("semaine");
  const [currentDate,setCurrentDate]=useState(new Date());
  const [data,setData]=useState({});
  const [settings,setSettings]=useState({heuresHebdo:35,nom:""});
  const [editDay,setEditDay]=useState(null);
  const [toast,setToast]=useState(null);
  const [flash,setFlash]=useState(null);

  useEffect(()=>{ try{ const d=localStorage.getItem("pointeuse_data2"),s=localStorage.getItem("pointeuse_settings"); if(d) setData(JSON.parse(d)); if(s) setSettings(JSON.parse(s)); }catch{} },[]);

  const save=useCallback((nd,ns)=>{ try{ localStorage.setItem("pointeuse_data2",JSON.stringify(nd)); localStorage.setItem("pointeuse_settings",JSON.stringify(ns)); }catch{} },[]);
  const showToast=msg=>{ setToast(msg); setTimeout(()=>setToast(null),2500); };

  const handleSaveDay=useCallback((dk,val)=>{ setData(prev=>{const nd={...prev,[dk]:val};save(nd,settings);return nd;}); showToast("Enregistré ✓"); },[settings,save]);
  const handleDeleteDay=useCallback((dk)=>{ setData(prev=>{const nd={...prev};delete nd[dk];save(nd,settings);return nd;}); showToast("Entrée supprimée"); },[settings,save]);
  const updateSettings=useCallback(s=>{ setSettings(s); save(data,s); },[data,save]);
  const setCurrentDateAndView=(d,v)=>{ setCurrentDate(d); setView(v); };

  const handlePointage=()=>{
    const now=new Date(),h=now.getHours(),m=now.getMinutes();
    let targetDate=new Date(now),apresMinuit=false;
    if(h<6){ targetDate.setDate(targetDate.getDate()-1); apresMinuit=true; }
    const dk=dateKey(targetDate),existing=data[dk]||{};
    if(existing.special){ showToast("Jour Repos/Férié — modifie-le d'abord"); return; }
    const idx=nextCreneauIndex(existing);
    if(idx===-1){ showToast("Journée complète — ouvre le jour pour corriger"); return; }
    const creneau=CRENEAUX[idx];
    let heureStr=`${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}`;
    if(apresMinuit) heureStr=`${h+24}:${String(m).padStart(2,"0")}`;
    handleSaveDay(dk,{...existing,[creneau.field]:heureStr});
    const displayH=apresMinuit?`${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")} †`:heureStr;
    setFlash({label:creneau.label,heure:displayH,dk,icon:creneau.icon,color:creneau.color});
    setTimeout(()=>setFlash(null),4000);
  };

  const exportCSV=()=>{
    const rows=[["Date","Jour","Type","Matin arrivée","Matin départ","Soir arrivée","Soir départ","Total (h)"]];
    for(const k of Object.keys(data).sort()){ const v=data[k],d=parseKey(k),j=JOURS_FULL[(d.getDay()+6)%7]; if(v.special) rows.push([k,j,TYPE_SPECIAL[v.special]||v.special,"","","","","0"]); else rows.push([k,j,"Travail",displayHeure(v.matin_debut),displayHeure(v.matin_fin),displayHeure(v.soir_debut),displayHeure(v.soir_fin),(calcJour(v)/60).toFixed(2)]); }
    const blob=new Blob(["\uFEFF"+rows.map(r=>r.join(";")).join("\n")],{type:"text/csv;charset=utf-8;"});
    const url=URL.createObjectURL(blob),a=document.createElement("a"); a.href=url; a.download="pointeuse.csv"; a.click(); URL.revokeObjectURL(url);
    showToast("Export CSV téléchargé ✓");
  };

  const exportPDF=()=>{
    const sorted=Object.keys(data).sort(),semaines={};
    for(const k of sorted){ const ws=dateKey(getWeekStart(parseKey(k))); if(!semaines[ws]) semaines[ws]=[]; semaines[ws].push(k); }
    let html=`<html><head><meta charset="utf-8"><title>Pointeuse</title><style>body{font-family:sans-serif;font-size:12px;padding:20px}h1{font-size:18px}h2{font-size:13px;margin-top:18px;border-bottom:1px solid #ccc;padding-bottom:4px}table{border-collapse:collapse;width:100%;margin-top:6px}th,td{border:1px solid #ddd;padding:4px 8px;text-align:left}th{background:#f5f5f5}.pos{color:green}.neg{color:red}</style></head><body><h1>Pointeuse${settings.nom?" — "+settings.nom:""}</h1><p>Forfait : <b>${settings.heuresHebdo}h/semaine</b></p>`;
    for(const [wk,keys] of Object.entries(semaines).sort()){ const ws=parseKey(wk),we=new Date(ws); we.setDate(ws.getDate()+6); const tot=keys.reduce((a,k)=>a+calcJour(data[k]),0),solde=tot-settings.heuresHebdo*60; html+=`<h2>Semaine ${ws.getDate()} ${MOIS[ws.getMonth()].slice(0,3)} – ${we.getDate()} ${MOIS[we.getMonth()].slice(0,3)} ${we.getFullYear()}</h2><table><tr><th>Date</th><th>Jour</th><th>Matin</th><th>Soir</th><th>Total</th></tr>`; for(const k of keys){ const v=data[k],d=parseKey(k),j=JOURS_FULL[(d.getDay()+6)%7]; if(v.special) html+=`<tr><td>${k}</td><td>${j}</td><td colspan="3" style="color:#888;font-style:italic">${TYPE_SPECIAL[v.special]||v.special}</td></tr>`; else{ const mat=(v.matin_debut||v.matin_fin)?`${displayHeure(v.matin_debut)} → ${displayHeure(v.matin_fin)}`:"—",soi=(v.soir_debut||v.soir_fin)?`${displayHeure(v.soir_debut)} → ${displayHeure(v.soir_fin)}`:"—"; html+=`<tr><td>${k}</td><td>${j}</td><td>${mat}</td><td>${soi}</td><td>${minutesToHM(calcJour(v))}</td></tr>`; } } html+=`<tr><td colspan="4"><b>Total semaine</b></td><td><b>${minutesToHM(tot)}</b> <span class="${solde>=0?"pos":"neg"}">(${solde>=0?"+":""}${minutesToHM(solde)})</span></td></tr></table>`; }
    html+="</body></html>";
    const w=window.open("","_blank"); w.document.write(html); w.document.close(); w.print();
    showToast("Fenêtre d'impression ouverte ✓");
  };

  const resetData=()=>{ if(window.confirm("Supprimer toutes les données ?")){ setData({}); save({},settings); showToast("Données effacées"); } };

  const today=new Date(),todayEntry=data[dateKey(today)]||{},nextIdx=nextCreneauIndex(todayEntry),nextCreneau=nextIdx>=0?CRENEAUX[nextIdx]:null;

  return (
    <div style={S.app}>
      <div style={S.header}>
        <div style={S.headerLeft}><div style={S.logo}>⏱</div><div><div style={S.appTitle}>Pointeuse</div>{settings.nom&&<div style={S.appSub}>{settings.nom}</div>}</div></div>
        <button style={S.settingsIconBtn} onClick={()=>setView(v=>v==="settings"?"semaine":"settings")}>{view==="settings"?"✕":"☰"}</button>
      </div>

      {view!=="settings"&&(
        <div style={S.pointageZone}>
          {nextCreneau?(
            <button style={S.pointageBtn} onClick={handlePointage}>
              <span style={{fontSize:30}}>{nextCreneau.icon}</span>
              <div><div style={S.pointageBtnLabel}>Pointer maintenant</div><div style={{...S.pointageBtnSub,color:nextCreneau.color}}>{nextCreneau.label}</div></div>
              <div style={S.pointageArrow}>→</div>
            </button>
          ):(
            <div style={S.pointageDone}>✓ Journée complète</div>
          )}
        </div>
      )}

      {flash&&(
        <div style={S.flashCard}>
          <span style={{fontSize:26}}>{flash.icon}</span>
          <div style={{flex:1}}>
            <div style={{fontSize:11,color:"#8b86aa",fontWeight:700,textTransform:"uppercase",letterSpacing:.5}}>{flash.label}</div>
            <div style={{fontSize:30,fontWeight:800,color:"#f0eeff",lineHeight:1.1}}>{flash.heure}</div>
            {flash.heure.includes("†")&&<div style={{fontSize:10,color:"#facc15"}}>Rattaché à la veille</div>}
          </div>
          <button style={S.flashCorrect} onClick={()=>{setEditDay(flash.dk);setFlash(null);}}>Corriger</button>
        </div>
      )}

      {view!=="settings"&&(
        <div style={S.tabs}>
          {[["semaine","Semaine"],["mois","Mois"],["annee","Année"]].map(([k,l])=>(
            <button key={k} style={{...S.tab,...(view===k?S.tabActive:{})}} onClick={()=>setView(k)}>{l}</button>
          ))}
        </div>
      )}

      <div style={S.body}>
        {view==="semaine"&&<VueSemaine currentDate={currentDate} setCurrentDate={setCurrentDate} data={data} settings={settings} setEditDay={setEditDay}/>}
        {view==="mois"&&<VueMois currentDate={currentDate} setCurrentDate={setCurrentDate} data={data} settings={settings} setEditDay={setEditDay}/>}
        {view==="annee"&&<VueAnnee currentDate={currentDate} setCurrentDate={setCurrentDate} data={data} settings={settings} setCurrentDateAndView={setCurrentDateAndView}/>}
        {view==="settings"&&<VueSettings settings={settings} updateSettings={updateSettings} exportCSV={exportCSV} exportPDF={exportPDF} resetData={resetData} showToast={showToast}/>}
      </div>

      {editDay&&<DayEditor dk={editDay} data={data} settings={settings} onSave={handleSaveDay} onDelete={handleDeleteDay} onClose={()=>setEditDay(null)}/>}
      {toast&&<div style={S.toast}>{toast}</div>}
    </div>
  );
}
