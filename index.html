<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
  <title>Badgeo</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⏱</text></svg>">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:#0c0c14;color:#e8e6f0;font-family:'DM Sans','Segoe UI',sans-serif}
    input,select{color-scheme:dark}
    select{appearance:none}
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useCallback, useRef } = React;

const JOURS_FULL = ["Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi","Dimanche"];
const MOIS = ["Janvier","Février","Mars","Avril","Mai","Juin","Juillet","Août","Septembre","Octobre","Novembre","Décembre"];
const TYPE_SPECIAL = { repos:"Repos", ferie:"Férié" };
const PRESETS = { matinsoir:{p1:"Matin",p2:"Soir"}, matinapm:{p1:"Matin",p2:"Après-midi"} };
const ROUND_OPTS = [{v:0,l:"Aucun"},{v:5,l:"5 min"},{v:10,l:"10 min"},{v:15,l:"15 min"}];

// ─── UTILS ───────────────────────────────────────────────────────────────────
function dk(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function pk(k){ var p=k.split("-"); return new Date(Number(p[0]),Number(p[1])-1,Number(p[2])); }
function h2m(hm){ if(!hm) return null; var p=hm.split(":"); return (parseInt(p[0])||0)*60+(parseInt(p[1])||0); }
function m2h(min){ if(min===null||min===undefined) return ""; var a=Math.abs(min),h=Math.floor(a/60),m=a%60; return (min<0?"-":"")+h+"h"+String(m).padStart(2,"0"); }
function dH(hm){ if(!hm) return "—"; var h=parseInt(hm.split(":")[0]),m=hm.split(":")[1]; return h>=24?String(h-24).padStart(2,"0")+":"+m+"†":hm; }
function rnd(min,r){ return r>0?Math.round(min/r)*r:min; }
function wkStart(d,fd){ var dt=new Date(d),day=dt.getDay(),diff=((day-fd)+7)%7; dt.setDate(dt.getDate()-diff); dt.setHours(0,0,0,0); return dt; }
function wkDays(ref,fd){ var ws=wkStart(ref,fd),arr=[]; for(var i=0;i<7;i++){var d=new Date(ws);d.setDate(ws.getDate()+i);arr.push(d);} return arr; }
function jCourt(d){ return JOURS_FULL[(d.getDay()+6)%7].slice(0,3); }
function jNom(d){ return JOURS_FULL[(d.getDay()+6)%7]; }

function calcPauses(e,paidBreak){
  if(!e||paidBreak) return 0;
  var s=h2m(e.pause_debut),f=h2m(e.pause_fin);
  if(s===null||f===null) return 0;
  var d=f-s; if(d<0) d+=24*60; return Math.max(0,d);
}
function calcJour(e,paidBreak){
  if(!e||e.special) return 0;
  var t=0;
  var md=h2m(e.matin_debut),mf=h2m(e.matin_fin);
  if(md!==null&&mf!==null&&mf>md) t+=mf-md;
  if(!e.singlePeriod){
    var sd=h2m(e.soir_debut),sf=h2m(e.soir_fin);
    if(sd!==null&&sf!==null){ if(sf<sd) sf+=24*60; if(sf>sd) t+=sf-sd; }
  }
  return Math.max(0,t-calcPauses(e,paidBreak));
}
function totalAdj(adjLines){
  if(!adjLines) return 0;
  var lines=Array.isArray(adjLines)?adjLines:Object.values(adjLines);
  var t=0;
  for(var i=0;i<lines.length;i++){
    var l=lines[i];
    if(!l||typeof l!=="object") continue;
    t+=(Math.abs(l.heures||0)*60+Math.abs(l.mins||0))*(l.signe==="-"?1:-1);
  }
  return t;
}
function mainFields(single){ return single?["matin_debut","matin_fin"]:["matin_debut","matin_fin","soir_debut","soir_fin"]; }
function nextMainIdx(e,single){
  var f=mainFields(single||(e&&e.singlePeriod));
  if(!e) return 0;
  for(var i=0;i<f.length;i++) if(!e[f[i]]) return i;
  return -1;
}
function nextPauseIdx(e){
  if(!e) return null;
  if(!e.pause_debut) return "debut";
  if(!e.pause_fin) return "fin";
  return null;
}
function getMainCreneaux(labels,single){
  var p1=labels.p1||"Matin",p2=labels.p2||"Après-midi";
  if(single) return [
    {label:"Arrivée",field:"matin_debut",icon:"🌅",color:"#4ade80"},
    {label:"Départ",field:"matin_fin",icon:"🌙",color:"#c4b8ff"},
  ];
  return [
    {label:"Arrivée "+p1,field:"matin_debut",icon:"🌅",color:"#4ade80"},
    {label:"Départ "+p1,field:"matin_fin",icon:"☀️",color:"#facc15"},
    {label:"Arrivée "+p2,field:"soir_debut",icon:"🌆",color:"#60a5fa"},
    {label:"Départ "+p2,field:"soir_fin",icon:"🌙",color:"#c4b8ff"},
  ];
}
function nb(dark){ return {background:dark?"#1a1a28":"#eeeef6",color:dark?"#c4b8ff":"#6c5ce7",border:"none",width:34,height:34,borderRadius:8,fontSize:20,cursor:"pointer"}; }

// ─── ERROR BOUNDARY ──────────────────────────────────────────────────────────
class SafeView extends React.Component {
  constructor(props){ super(props); this.state={error:null}; }
  static getDerivedStateFromError(err){ return {error:err.message||String(err)}; }
  componentDidCatch(err){ this.setState({error:err.message||String(err)}); }
  render(){
    if(this.state.error) return (
      <div style={{padding:20,color:"#f87171",fontSize:13,background:"#1a0a0a",margin:14,borderRadius:12,border:"1px solid #f87171"}}>
        <div style={{fontWeight:700,marginBottom:8}}>Erreur {this.props.name} :</div>
        <div style={{fontFamily:"monospace",wordBreak:"break-all"}}>{this.state.error}</div>
      </div>
    );
    return this.props.children;
  }
}

// ─── SUMMARY CARD ────────────────────────────────────────────────────────────
function SummaryCard(props){
  var rows=props.rows,dark=props.dark;
  return (
    <div style={{background:dark?"#16162a":"#f0f0f8",borderRadius:12,padding:"12px 14px",marginBottom:10}}>
      {rows.map(function(r,i){
        return (
          <div key={i} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"4px 0",fontSize:r.sep?15:13,color:dark?"#b0aac8":"#555",borderTop:r.sep?(dark?"1px solid #2a2a3a":"1px solid #ddd"):"none",marginTop:r.sep?5:0,paddingTop:r.sep?7:4}}>
            <span>{r.label}</span>
            <strong style={{color:r.color||(dark?"#f0eeff":"#1a1a2e")}}>{r.value}</strong>
          </div>
        );
      })}
    </div>
  );
}

// ─── MODAL JOUR ──────────────────────────────────────────────────────────────
function DayEditor(props){
  var dkey=props.dkey,data=props.data,settings=props.settings,onSave=props.onSave,onDelete=props.onDelete,onClose=props.onClose;
  var d=pk(dkey),labels=PRESETS[settings.preset]||PRESETS.matinapm;
  var [loc,setLoc]=useState(Object.assign({},data[dkey]||{}));
  var dark=settings.theme!=="light";
  var single=!!loc.singlePeriod;
  var pauseMin=calcPauses(loc,settings.paidBreak);
  var total=calcJour(loc,settings.paidBreak);
  var bg=dark?"#14142a":"#fff",fg=dark?"#e8e6f0":"#1a1a2e",sub=dark?"#8b86aa":"#888";
  var iS={background:dark?"#0c0c14":"#f7f7fb",color:fg,border:"1px solid "+(dark?"#2a2a3a":"#ddd"),borderRadius:8,padding:"7px 10px",fontSize:13,width:"100%",boxSizing:"border-box"};

  function setSpecial(t){ setLoc(function(p){ return p.special===t?{}:{special:t}; }); }
  function upd(f,v){ setLoc(function(p){ var n=Object.assign({},p); delete n.special; if(v) n[f]=v; else delete n[f]; return n; }); }
  function toggleSingle(){ setLoc(function(p){ var n=Object.assign({},p); n.singlePeriod=!p.singlePeriod; delete n.soir_debut; delete n.soir_fin; return n; }); }
  function handleSave(){ var c=Object.assign({},loc); Object.keys(c).forEach(function(k){if(c[k]===undefined||c[k]==="")delete c[k];}); onSave(dkey,c); onClose(); }

  return (
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.75)",zIndex:100,display:"flex",alignItems:"flex-end"}} onClick={function(e){if(e.target===e.currentTarget)onClose();}}>
      <div style={{background:bg,color:fg,borderRadius:"18px 18px 0 0",width:"100%",maxWidth:480,margin:"0 auto",padding:"18px 18px 32px",maxHeight:"92vh",overflowY:"auto"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:14}}>
          <div>
            <div style={{fontSize:19,fontWeight:700,color:fg}}>{jNom(d)}</div>
            <div style={{fontSize:12,color:sub,marginTop:2}}>{d.getDate()} {MOIS[d.getMonth()]} {d.getFullYear()}</div>
          </div>
          <button style={{background:"none",border:"none",color:sub,fontSize:20,cursor:"pointer"}} onClick={onClose}>✕</button>
        </div>
        <div style={{display:"flex",gap:8,marginBottom:12}}>
          {Object.entries(TYPE_SPECIAL).map(function(kv){
            var k=kv[0],v=kv[1];
            return <button key={k} onClick={function(){setSpecial(k);}}
              style={{flex:1,borderRadius:10,padding:"10px",fontSize:14,cursor:"pointer",fontWeight:600,background:dark?(loc.special===k?"#221e38":"#1a1a28"):(loc.special===k?"#ede9ff":"#f0f0f8"),color:dark?(loc.special===k?"#c4b8ff":"#b0aac8"):(loc.special===k?"#6c5ce7":"#555"),border:"1.5px solid "+(loc.special===k?"#c4b8ff":(dark?"#2a2a3a":"#ddd"))}}>{v}</button>;
          })}
        </div>
        {!loc.special&&(
          <div>
            <label style={{display:"flex",alignItems:"center",gap:8,marginBottom:12,fontSize:13,color:sub,cursor:"pointer"}}>
              <input type="checkbox" checked={single} onChange={toggleSingle} style={{width:16,height:16,accentColor:"#c4b8ff"}}/>
              ⏳ Journée en une seule période
            </label>
            <div style={{background:dark?"#1a1a28":"#f7f7fb",borderRadius:12,padding:"12px",marginBottom:8}}>
              <div style={{fontSize:11,fontWeight:700,textTransform:"uppercase",color:sub,marginBottom:8}}>🌅 {single?"Journée":labels.p1}</div>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
                <label style={{display:"flex",flexDirection:"column",gap:3,fontSize:11,fontWeight:600,color:sub}}>Arrivée<input type="time" style={iS} value={loc.matin_debut||""} onChange={function(e){upd("matin_debut",e.target.value);}}/></label>
                <label style={{display:"flex",flexDirection:"column",gap:3,fontSize:11,fontWeight:600,color:sub}}>Départ<input type="time" style={iS} value={loc.matin_fin||""} onChange={function(e){upd("matin_fin",e.target.value);}}/></label>
              </div>
            </div>
            <div style={{background:dark?"#1a1a28":"#f7f7fb",borderRadius:12,padding:"12px",marginBottom:8,border:"1px solid "+(dark?"#2a2040":"#ffe8d6")}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
                <div style={{fontSize:11,fontWeight:700,textTransform:"uppercase",color:"#fb923c"}}>☕ Pause</div>
                <span style={{fontSize:11,color:settings.paidBreak?"#4ade80":"#fb923c",fontWeight:600}}>{settings.paidBreak?"Payée":"Déduite"}</span>
              </div>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
                <label style={{display:"flex",flexDirection:"column",gap:3,fontSize:11,fontWeight:600,color:sub}}>Départ pause<input type="time" style={iS} value={loc.pause_debut||""} onChange={function(e){upd("pause_debut",e.target.value);}}/></label>
                <label style={{display:"flex",flexDirection:"column",gap:3,fontSize:11,fontWeight:600,color:sub}}>Retour pause<input type="time" style={iS} value={loc.pause_fin||""} onChange={function(e){upd("pause_fin",e.target.value);}}/></label>
              </div>
              {pauseMin>0&&<div style={{fontSize:11,color:settings.paidBreak?"#4ade80":"#fb923c",marginTop:4}}>{settings.paidBreak?"Payée":"Déduite"} : {m2h(pauseMin)}</div>}
            </div>
            {!single&&(
              <div style={{background:dark?"#1a1a28":"#f7f7fb",borderRadius:12,padding:"12px",marginBottom:8}}>
                <div style={{fontSize:11,fontWeight:700,textTransform:"uppercase",color:sub,marginBottom:8}}>🌆 {labels.p2}</div>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
                  <label style={{display:"flex",flexDirection:"column",gap:3,fontSize:11,fontWeight:600,color:sub}}>Arrivée<input type="time" style={iS} value={loc.soir_debut||""} onChange={function(e){upd("soir_debut",e.target.value);}}/></label>
                  <label style={{display:"flex",flexDirection:"column",gap:3,fontSize:11,fontWeight:600,color:sub}}>
                    <span>Départ <span style={{fontSize:9,color:"#999"}}>†après minuit</span></span>
                    <input type="text" placeholder="18:30 ou 25:30" style={iS} value={loc.soir_fin||""} onChange={function(e){upd("soir_fin",e.target.value);}}/>
                  </label>
                </div>
              </div>
            )}
            {total>0&&<div style={{textAlign:"right",color:"#c4b8ff",fontSize:15,marginBottom:8,fontWeight:700}}>Total net : <strong>{m2h(total)}</strong>{pauseMin>0&&!settings.paidBreak&&<span style={{fontSize:11,color:"#fb923c",marginLeft:8}}>(pause {m2h(pauseMin)} déduite)</span>}</div>}
          </div>
        )}
        <div style={{display:"flex",gap:8,marginTop:14}}>
          {data[dkey]&&<button style={{background:"#2a1414",border:"1px solid #f87171",color:"#f87171",borderRadius:12,padding:"13px 14px",fontSize:14,cursor:"pointer",fontWeight:600}} onClick={function(){onDelete(dkey);onClose();}}>Supprimer</button>}
          <button style={{flex:1,background:"#c4b8ff",color:"#0c0c14",border:"none",borderRadius:12,padding:"13px",fontSize:15,fontWeight:700,cursor:"pointer"}} onClick={handleSave}>Enregistrer</button>
        </div>
      </div>
    </div>
  );
}

// ─── MODAL AJUSTEMENTS ───────────────────────────────────────────────────────
function AjustModal(props){
  var yearMonth=props.yearMonth,adjustments=props.adjustments,onSave=props.onSave,onClose=props.onClose,dark=props.dark;
  var existing=Array.isArray(adjustments[yearMonth])?adjustments[yearMonth]:[];
  var empty={signe:"-",heures:0,mins:0,motif:""};
  var [lines,setLines]=useState(existing.length>0?existing:[Object.assign({},empty)]);
  var bg=dark?"#14142a":"#fff",fg=dark?"#e8e6f0":"#1a1a2e",sub=dark?"#8b86aa":"#888";
  var iS={background:dark?"#0c0c14":"#f7f7fb",color:fg,border:"1px solid "+(dark?"#2a2a3a":"#ddd"),borderRadius:8,padding:"7px 10px",fontSize:13,width:"100%",boxSizing:"border-box"};

  function updLine(i,f,v){ setLines(function(p){ return p.map(function(l,idx){ return idx===i?Object.assign({},l,{[f]:v}):l; }); }); }
  function addLine(){ if(lines.length<5) setLines(function(p){ return p.concat([Object.assign({},empty)]); }); }
  function delLine(i){ setLines(function(p){ return p.filter(function(_,idx){ return idx!==i; }); }); }

  var totalAdjVal=lines.reduce(function(a,l){ return a+(Math.abs(l.heures||0)*60+Math.abs(l.mins||0))*(l.signe==="-"?1:-1); },0);

  function handleSave(){
    var clean=lines.filter(function(l){ return (l.heures||0)+(l.mins||0)>0; });
    onSave(yearMonth,clean); onClose();
  }

  return (
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.75)",zIndex:200,display:"flex",alignItems:"flex-end"}} onClick={function(e){if(e.target===e.currentTarget)onClose();}}>
      <div style={{background:bg,color:fg,borderRadius:"18px 18px 0 0",width:"100%",maxWidth:480,margin:"0 auto",padding:"18px 18px 32px",maxHeight:"92vh",overflowY:"auto"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
          <div style={{fontSize:17,fontWeight:700,color:fg}}>⚖️ Ajustements du solde</div>
          <button style={{background:"none",border:"none",color:sub,fontSize:20,cursor:"pointer"}} onClick={onClose}>✕</button>
        </div>
        <div style={{fontSize:12,color:sub,marginBottom:14}}>Heures récupérées ou payées (−) déduites du solde. Heures bonus (+) ajoutées.</div>
        {lines.map(function(l,i){
          return (
            <div key={i} style={{background:dark?"#1a1a28":"#f7f7fb",borderRadius:12,padding:"10px 12px",marginBottom:8,border:"1px solid "+(dark?"#2a2a3a":"#eee")}}>
              <div style={{display:"flex",gap:6,alignItems:"center",marginBottom:6}}>
                <select value={l.signe} onChange={function(e){updLine(i,"signe",e.target.value);}}
                  style={{background:dark?"#0c0c14":"#f7f7fb",color:fg,border:"1px solid "+(dark?"#2a2a3a":"#ddd"),borderRadius:8,width:54,textAlign:"center",fontSize:18,fontWeight:700,padding:"6px 4px"}}>
                  <option value="-">−</option>
                  <option value="+">+</option>
                </select>
                <input type="number" min="0" max="999" placeholder="0" style={Object.assign({},iS,{flex:1,textAlign:"center"})} value={l.heures||""} onChange={function(e){updLine(i,"heures",Number(e.target.value));}}/>
                <span style={{color:sub,fontSize:13}}>h</span>
                <input type="number" min="0" max="59" placeholder="0" style={Object.assign({},iS,{flex:1,textAlign:"center"})} value={l.mins||""} onChange={function(e){updLine(i,"mins",Number(e.target.value));}}/>
                <span style={{color:sub,fontSize:13}}>min</span>
                <button onClick={function(){delLine(i);}} style={{background:"none",border:"none",color:"#f87171",fontSize:18,cursor:"pointer",padding:"0 4px"}}>✕</button>
              </div>
              <input type="text" placeholder="Motif (ex. Heures sup payées)" style={iS} value={l.motif||""} onChange={function(e){updLine(i,"motif",e.target.value);}}/>
            </div>
          );
        })}
        {lines.length<5&&<button onClick={addLine} style={{width:"100%",background:"none",border:"1px dashed "+(dark?"#3a3260":"#ddd"),borderRadius:10,padding:"9px",color:dark?"#8b86aa":"#aaa",cursor:"pointer",fontSize:13,marginBottom:12}}>+ Ajouter une ligne</button>}
        {totalAdjVal!==0&&<div style={{textAlign:"center",fontSize:15,fontWeight:700,color:totalAdjVal>0?"#f87171":"#4ade80",marginBottom:12}}>{totalAdjVal>0?"−":"+"}{m2h(Math.abs(totalAdjVal))} {totalAdjVal>0?"retiré du solde":"ajouté au solde"}</div>}
        <div style={{display:"flex",gap:8,marginTop:8}}>
          <button style={{flex:1,background:dark?"#2a2a3a":"#eee",color:sub,border:"none",borderRadius:12,padding:"13px",fontSize:13,fontWeight:700,cursor:"pointer"}} onClick={function(){onSave(yearMonth,[]);onClose();}}>Effacer tout</button>
          <button style={{flex:1,background:"#c4b8ff",color:"#0c0c14",border:"none",borderRadius:12,padding:"13px",fontSize:15,fontWeight:700,cursor:"pointer"}} onClick={handleSave}>Enregistrer</button>
        </div>
      </div>
    </div>
  );
}

// ─── VUE SEMAINE ─────────────────────────────────────────────────────────────
function VueSemaine(props){
  var cur=props.cur,setCur=props.setCur,data=props.data,settings=props.settings,setEdit=props.setEdit;
  var today=new Date(),todayKey=dk(today);
  var fd=Number(settings.firstDay)||1;
  var days=wkDays(cur,fd);
  var total=0;
  for(var i=0;i<days.length;i++) total+=calcJour(data[dk(days[i])],settings.paidBreak);
  var solde=total-Number(settings.heuresHebdo)*60;
  var dark=settings.theme!=="light";
  var ws=days[0],we=days[6];
  return (
    <div style={{padding:"14px 14px 0"}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:14}}>
        <button style={nb(dark)} onClick={function(){var d=new Date(cur);d.setDate(d.getDate()-7);setCur(d);}}>‹</button>
        <div style={{fontSize:14,fontWeight:600,color:dark?"#f0eeff":"#1a1a2e"}}>{ws.getDate()} {MOIS[ws.getMonth()].slice(0,3)} – {we.getDate()} {MOIS[we.getMonth()].slice(0,3)} {we.getFullYear()}</div>
        <button style={nb(dark)} onClick={function(){var d=new Date(cur);d.setDate(d.getDate()+7);setCur(d);}}>›</button>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:5,marginBottom:14}}>
        {days.map(function(d){
          var dkk=dk(d),e=data[dkk],mins=calcJour(e,settings.paidBreak),isToday=dkk===todayKey,isSp=e&&e.special;
          return (
            <div key={dkk} onClick={function(){setEdit(dkk);}}
              style={{background:dark?(isToday?"#1e1c36":"#16162a"):(isToday?"#ede9ff":"#f7f7fb"),border:"1.5px solid "+(isToday?(dark?"#c4b8ff":"#9b8de8"):"transparent"),borderRadius:10,padding:"9px 3px",textAlign:"center",cursor:"pointer"}}>
              <div style={{fontSize:9,color:dark?"#8b86aa":"#aaa",marginBottom:3,fontWeight:700,textTransform:"uppercase"}}>{jCourt(d)}</div>
              <div style={{fontSize:17,fontWeight:700,color:dark?"#f0eeff":"#1a1a2e",lineHeight:1}}>{d.getDate()}</div>
              {isSp?<div style={{fontSize:9,color:"#f59e42",marginTop:3,fontWeight:700}}>{e.special==="repos"?"R":"F"}</div>
               :mins>0?<div style={{fontSize:9,color:"#c4b8ff",marginTop:3,fontWeight:700}}>{m2h(mins)}</div>
               :e?<div style={{fontSize:9,color:"#facc15",marginTop:3}}>…</div>
               :<div style={{fontSize:10,color:dark?"#2e2e44":"#ccc",marginTop:3}}>—</div>}
            </div>
          );
        })}

// ─── VUE MOIS ────────────────────────────────────────────────────────────────
function VueMois(props){
  var cur=props.cur,setCur=props.setCur,data=props.data,settings=props.settings,setEdit=props.setEdit;
  var adjustments=props.adjustments,setAdjustments=props.setAdjustments,saveAll=props.saveAll;
  var today=new Date(),todayKey=dk(today);
  var y=cur.getFullYear(),mo=cur.getMonth();
  var ym=y+"-"+String(mo+1).padStart(2,"0");
  var dark=settings.theme!=="light";
  var fd=Number(settings.firstDay)||1;
  var hebdo=Number(settings.heuresHebdo)||35;
  var [showAdj,setShowAdj]=useState(false);
  var allKeys=Object.keys(data);

  var total=0;
  for(var i=0;i<allKeys.length;i++){
    var dd=pk(allKeys[i]);
    if(dd.getFullYear()===y&&dd.getMonth()===mo) total+=calcJour(data[allKeys[i]],settings.paidBreak);
  }
  var dim=new Date(y,mo+1,0).getDate();
  var firstDayOff=((new Date(y,mo,1).getDay()-fd)+7)%7;
  var sem=Math.ceil((dim+firstDayOff)/7);
  var forfait=hebdo*60*sem;
  var adjLines=Array.isArray(adjustments[ym])?adjustments[ym]:[];
  var adjMin=totalAdj(adjLines);
  var soldeMois=total-forfait;
  var soldeMoisNet=soldeMois-adjMin;

  var totY=0,forfY=0,adjY=0;
  for(var mi=0;mi<=mo;mi++){
    var d1=new Date(y,mi,1),d2=new Date(y,mi+1,0);
    var off=((d1.getDay()-fd)+7)%7;
    forfY+=hebdo*60*Math.ceil((d2.getDate()+off)/7);
    adjY+=totalAdj(adjustments[y+"-"+String(mi+1).padStart(2,"0")]||[]);
    for(var ki=0;ki<allKeys.length;ki++){
      var ddi=pk(allKeys[ki]);
      if(ddi.getFullYear()===y&&ddi.getMonth()===mi) totY+=calcJour(data[allKeys[ki]],settings.paidBreak);
    }
  }
  var soldeY=totY-forfY-adjY;

  var cells=[];
  for(var ci=0;ci<firstDayOff;ci++) cells.push(null);
  for(var di=1;di<=dim;di++) cells.push(new Date(y,mo,di));
  var joursH=[];
  for(var ji=0;ji<7;ji++) joursH.push(JOURS_FULL[((fd-1)+ji)%7].slice(0,3));

  var summaryRows=[
    {label:"Total mois",value:m2h(total)},
    {label:"Forfait ("+sem+" sem.)",value:m2h(forfait)},
    {label:"Solde brut",value:(soldeMois>=0?"+":"")+m2h(soldeMois),color:soldeMois>=0?"#4ade80":"#f87171",sep:true},
  ];
  for(var ai=0;ai<adjLines.length;ai++){
    var al=adjLines[ai];
    if((al.heures||0)+(al.mins||0)>0){
      var am=(Math.abs(al.heures||0)*60+Math.abs(al.mins||0))*(al.signe==="-"?1:-1);
      summaryRows.push({label:al.motif||"Ajustement",value:(am>0?"−":"+")+m2h(Math.abs(am)),color:"#fb923c"});
    }
  }
  if(adjMin!==0) summaryRows.push({label:"Solde net mois",value:(soldeMoisNet>=0?"+":"")+m2h(soldeMoisNet),color:soldeMoisNet>=0?"#4ade80":"#f87171",sep:true});
  summaryRows.push({label:"Solde cumulé année",value:(soldeY>=0?"+":"")+m2h(soldeY),color:soldeY>=0?"#4ade80":"#f87171",sep:adjMin===0});

  function handleSaveAdj(ym,val){ var na=Object.assign({},adjustments,{[ym]:val}); setAdjustments(na); saveAll(data,settings,na); }

  return (
    <div style={{padding:"14px 14px 0"}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:14}}>
        <button style={nb(dark)} onClick={function(){var d=new Date(cur);d.setDate(1);d.setMonth(d.getMonth()-1);setCur(d);}}>‹</button>
        <div style={{fontSize:14,fontWeight:600,color:dark?"#f0eeff":"#1a1a2e"}}>{MOIS[mo]} {y}</div>
        <button style={nb(dark)} onClick={function(){var d=new Date(cur);d.setDate(1);d.setMonth(d.getMonth()+1);setCur(d);}}>›</button>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:3,marginBottom:14}}>
        {joursH.map(function(j){ return <div key={j} style={{textAlign:"center",fontSize:10,fontWeight:700,padding:"3px 0",textTransform:"uppercase",color:dark?"#8b86aa":"#aaa"}}>{j}</div>; })}
        {cells.map(function(d,i){
          if(!d) return <div key={"e"+i}/>;
          var dkk=dk(d),e=data[dkk],mins=calcJour(e,settings.paidBreak),isToday=dkk===todayKey,isSp=e&&e.special;
          return (
            <div key={dkk} onClick={function(){setEdit(dkk);}}
              style={{background:dark?(isToday?"#1e1c36":"#16162a"):(isToday?"#ede9ff":"#f7f7fb"),border:"1.5px solid "+(isToday?(dark?"#c4b8ff":"#9b8de8"):"transparent"),borderRadius:7,padding:"5px 3px",textAlign:"center",cursor:"pointer",minHeight:44}}>
              <div style={{fontSize:12,fontWeight:600,color:dark?"#f0eeff":"#1a1a2e"}}>{d.getDate()}</div>
              {isSp?<div style={{fontSize:10,color:"#f59e42",fontWeight:700}}>{e.special==="repos"?"R":"F"}</div>:mins>0?<div style={{fontSize:9,color:"#c4b8ff",marginTop:2}}>{m2h(mins)}</div>:null}
            </div>
          );
        })}
      </div>
      <SummaryCard dark={dark} rows={summaryRows}/>
      <button onClick={function(){setShowAdj(true);}}
        style={{width:"100%",background:dark?"#1a1a28":"#f0f0f8",border:"1px solid "+(dark?"#2a2a3a":"#ddd"),borderRadius:10,padding:"10px",fontSize:13,color:dark?"#fb923c":"#b45309",cursor:"pointer",fontWeight:600,marginBottom:14}}>
        ⚖️ Ajuster le solde {adjLines.filter(function(l){return(l.heures||0)+(l.mins||0)>0;}).length>0?"("+adjLines.filter(function(l){return(l.heures||0)+(l.mins||0)>0;}).length+" ajustement(s))":""}
      </button>
      {showAdj&&<AjustModal yearMonth={ym} adjustments={adjustments} onSave={handleSaveAdj} onClose={function(){setShowAdj(false);}} dark={dark}/>}
    </div>
  );
}

    forfY+=hebdo*60*Math.ceil((d2.getDate()+off)/7);

    for(var j=0;j<allKeys.length;j++){
      var dd=pk(allKeys[j]);
      if(dd.getFullYear()===y&&dd.getMonth()===i) totY+=calcJour(data[allKeys[j]],settings.paidBreak);

          var hasAdj=Array.isArray(adjustments[y+"-"+String(i+1).padStart(2,"0")])&&adjustments[y+"-"+String(i+1).padStart(2,"0")].filter(function(l){return(l.heures||0)+(l.mins||0)>0;}).length>0;

        {label:"Ajustements",value:(adjY>0?"−":"+")+m2h(Math.abs(adjY)),color:"#fb923c"},
        {label:"Solde net année",value:(solde>=0?"+":"")+m2h(solde),color:solde>=0?"#4ade80":"#f87171",sep:true},
      ]}/>
    </div>
  );
}

// ─── APP PRINCIPALE ──────────────────────────────────────────────────────────
function Badgeo(){
  var [view,setView]=useState("semaine");
  var [cur,setCur]=useState(new Date());
  var [data,setData]=useState({});
  var [adjustments,setAdjustments]=useState({});
  var [settings,setSettings]=useState({heuresHebdo:35,nom:"",firstDay:1,preset:"matinapm",singlePeriodDefault:false,theme:"dark",roundMin:0,notifMatin:"",notifSoir:"",paidBreak:false});
  var [editDay,setEditDay]=useState(null);
  var [toast,setToast]=useState(null);
  var [flash,setFlash]=useState(null);
  var [singleToday,setSingleToday]=useState(false);

  useEffect(function(){
    try{
      var d=localStorage.getItem("badgeo_data"),s=localStorage.getItem("badgeo_settings"),a=localStorage.getItem("badgeo_adj");
      if(d) setData(JSON.parse(d));
      if(s) setSettings(function(p){ return Object.assign({},p,JSON.parse(s)); });
      if(a) setAdjustments(JSON.parse(a));
    }catch(e){}
  },[]);

  useEffect(function(){
    document.body.style.background=settings.theme==="light"?"#f4f4f8":"#0c0c14";
    document.body.style.color=settings.theme==="light"?"#1a1a2e":"#e8e6f0";
  },[settings.theme]);

  var saveAll=useCallback(function(nd,ns,na){
    try{
      localStorage.setItem("badgeo_data",JSON.stringify(nd));
      localStorage.setItem("badgeo_settings",JSON.stringify(ns));
      localStorage.setItem("badgeo_adj",JSON.stringify(na));
    }catch(e){}
  },[]);

  function showToast(msg){ setToast(msg); setTimeout(function(){setToast(null);},2500); }

  var handleSaveDay=useCallback(function(dkk,val){
    setData(function(p){ var nd=Object.assign({},p,{[dkk]:val}); saveAll(nd,settings,adjustments); return nd; });
    showToast("Enregistré ✓");
  },[settings,adjustments,saveAll]);

  var handleDelDay=useCallback(function(dkk){
    setData(function(p){ var nd=Object.assign({},p); delete nd[dkk]; saveAll(nd,settings,adjustments); return nd; });
    showToast("Supprimé");
  },[settings,adjustments,saveAll]);

  var updateSettings=useCallback(function(s){ setSettings(s); saveAll(data,s,adjustments); },[data,adjustments,saveAll]);
  function setCurAndView(d,v){ setCur(d); setView(v); }

  function handlePointage(){
    var now=new Date(),h=now.getHours(),m=now.getMinutes();
    var tgt=new Date(now),apres=false;
    if(h<6){ tgt.setDate(tgt.getDate()-1); apres=true; }
    var dkk=dk(tgt),ex=data[dkk]||{};
    if(ex.special){ showToast("Jour Repos/Férié"); return; }
    var useSingle=singleToday||settings.singlePeriodDefault||ex.singlePeriod;
    var idx=nextMainIdx(ex,useSingle);
    if(idx===-1){ showToast("Journée complète — ouvre le jour pour corriger"); return; }
    var crs=getMainCreneaux(PRESETS[settings.preset]||PRESETS.matinapm,useSingle);
    var cr=crs[idx];
    var tot=rnd(h*60+m,settings.roundMin||0);
    var hh=Math.floor(tot/60),mm=tot%60;
    if(apres) hh+=24;
    var heureStr=String(hh).padStart(2,"0")+":"+String(mm).padStart(2,"0");
    var nd=Object.assign({},ex,{[cr.field]:heureStr});
    if(useSingle&&!ex.singlePeriod) nd.singlePeriod=true;
    handleSaveDay(dkk,nd);
    var dHstr=apres?String(hh-24).padStart(2,"0")+":"+String(mm).padStart(2,"0")+" †":heureStr;
    setFlash({label:cr.label,heure:dHstr,dkk:dkk,icon:cr.icon,color:cr.color});
    setTimeout(function(){setFlash(null);},4000);
  }

  function handlePause(){
    var now=new Date(),h=now.getHours(),m=now.getMinutes();
    var tgt=new Date(now);
    if(h<6) tgt.setDate(tgt.getDate()-1);
    var dkk=dk(tgt),ex=data[dkk]||{};
    if(ex.special){ showToast("Jour Repos/Férié"); return; }
    var pIdx=nextPauseIdx(ex);
    if(!pIdx){ showToast("Pause déjà complète"); return; }
    var tot=rnd(h*60+m,settings.roundMin||0);
    var hh=Math.floor(tot/60),mm=tot%60;
    var heureStr=String(hh).padStart(2,"0")+":"+String(mm).padStart(2,"0");
    handleSaveDay(dkk,Object.assign({},ex,{["pause_"+pIdx]:heureStr}));
    setFlash({label:pIdx==="debut"?"Départ pause":"Retour pause",heure:heureStr,dkk:dkk,icon:pIdx==="debut"?"☕":"▶️",color:pIdx==="debut"?"#fb923c":"#a3e635"});
    setTimeout(function(){setFlash(null);},4000);
  }

  function exportCSV(){
    var labels=PRESETS[settings.preset]||PRESETS.matinapm;
    var rows=[["Date","Jour","Type","Arr. "+labels.p1,"Dép. "+labels.p1,"Dép. pause","Ret. pause","Pause","Arr. "+labels.p2,"Dép. "+labels.p2,"Total net (h)"]];
    var keys=Object.keys(data).sort();
    for(var i=0;i<keys.length;i++){
      var k=keys[i],v=data[k],d=pk(k),j=JOURS_FULL[(d.getDay()+6)%7];
      if(v.special) rows.push([k,j,TYPE_SPECIAL[v.special]||v.special,"","","","","","","","0"]);
      else rows.push([k,j,"Travail",dH(v.matin_debut),dH(v.matin_fin),dH(v.pause_debut),dH(v.pause_fin),settings.paidBreak?"payée":(calcPauses(v)/60).toFixed(2)+"h",v.singlePeriod?"(période unique)":dH(v.soir_debut),v.singlePeriod?"":dH(v.soir_fin),(calcJour(v,settings.paidBreak)/60).toFixed(2)]);
    }
    var blob=new Blob(["\uFEFF"+rows.map(function(r){return r.join(";");}).join("\n")],{type:"text/csv;charset=utf-8;"});
    var url=URL.createObjectURL(blob),a=document.createElement("a"); a.href=url; a.download="badgeo.csv"; a.click(); URL.revokeObjectURL(url);
    showToast("Export CSV ✓");
  }

  function exportJSON(){
    var payload={version:4,exportDate:new Date().toISOString(),data:data,settings:settings,adjustments:adjustments};
    var blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
    var url=URL.createObjectURL(blob),a=document.createElement("a"); a.href=url; a.download="badgeo-backup-"+dk(new Date())+".json"; a.click(); URL.revokeObjectURL(url);
    showToast("Sauvegarde JSON ✓");
  }

  function importJSON(file){
    if(!file) return;
    var reader=new FileReader();
    reader.onload=function(e){
      try{
        var p=JSON.parse(e.target.result);
        if(!p.data) throw new Error();
        if(window.confirm("Remplacer toutes les données actuelles ?")){
          var ns=p.settings?Object.assign({},settings,p.settings):settings;
          var na=p.adjustments||{};
          setData(p.data); setSettings(ns); setAdjustments(na); saveAll(p.data,ns,na);
          showToast("Données restaurées ✓");
        }
      }catch(err){ showToast("Fichier JSON invalide ✗"); }
    };
    reader.readAsText(file);
  }

  function exportPDF(){
    var labels=PRESETS[settings.preset]||PRESETS.matinapm;
    var sorted=Object.keys(data).sort(),semaines={};
    for(var i=0;i<sorted.length;i++){
      var ws=dk(wkStart(pk(sorted[i]),Number(settings.firstDay)||1));
      if(!semaines[ws]) semaines[ws]=[];
      semaines[ws].push(sorted[i]);
    }
    var html="<html><head><meta charset='utf-8'><title>Badgeo</title><style>body{font-family:sans-serif;font-size:12px;padding:20px}h1{font-size:18px}h2{font-size:13px;margin-top:18px;border-bottom:1px solid #ccc;padding-bottom:4px}table{border-collapse:collapse;width:100%;margin-top:6px}th,td{border:1px solid #ddd;padding:4px 8px;text-align:left}th{background:#f5f5f5}.pos{color:green}.neg{color:red}.pause{color:#f97316}</style></head><body><h1>Badgeo"+(settings.nom?" — "+settings.nom:"")+"</h1><p>Forfait : <b>"+settings.heuresHebdo+"h/semaine</b></p>";
    var wsKeys=Object.keys(semaines).sort();
    for(var wi=0;wi<wsKeys.length;wi++){
      var wk=wsKeys[wi],wkeys=semaines[wk];
      var wsd=pk(wk),wed=new Date(wsd); wed.setDate(wsd.getDate()+6);
      var tot=0; for(var ki=0;ki<wkeys.length;ki++) tot+=calcJour(data[wkeys[ki]],settings.paidBreak);
      var solde=tot-settings.heuresHebdo*60;
      html+="<h2>Semaine "+wsd.getDate()+" "+MOIS[wsd.getMonth()].slice(0,3)+" – "+wed.getDate()+" "+MOIS[wed.getMonth()].slice(0,3)+" "+wed.getFullYear()+"</h2><table><tr><th>Date</th><th>Jour</th><th>"+labels.p1+"</th><th>Pause</th><th>"+labels.p2+"</th><th>Total net</th></tr>";
      for(var ri=0;ri<wkeys.length;ri++){
        var rk=wkeys[ri],rv=data[rk],rd=pk(rk),rj=JOURS_FULL[(rd.getDay()+6)%7];
        if(rv.special) html+="<tr><td>"+rk+"</td><td>"+rj+"</td><td colspan='4' style='color:#888;font-style:italic'>"+(TYPE_SPECIAL[rv.special]||rv.special)+"</td></tr>";
        else{
          var mat=(rv.matin_debut||rv.matin_fin)?dH(rv.matin_debut)+"→"+dH(rv.matin_fin):"—";
          var pau=(rv.pause_debut||rv.pause_fin)?dH(rv.pause_debut)+"→"+dH(rv.pause_fin)+" ("+m2h(calcPauses(rv))+(settings.paidBreak?" payée":"")+")":" —";
          var soi=rv.singlePeriod?"(période unique)":(rv.soir_debut||rv.soir_fin)?dH(rv.soir_debut)+"→"+dH(rv.soir_fin):"—";
          html+="<tr><td>"+rk+"</td><td>"+rj+"</td><td>"+mat+"</td><td class='pause'>"+pau+"</td><td>"+soi+"</td><td>"+m2h(calcJour(rv,settings.paidBreak))+"</td></tr>";
        }
      }
      html+="<tr><td colspan='5'><b>Total semaine</b></td><td><b>"+m2h(tot)+"</b> <span class='"+(solde>=0?"pos":"neg")+"'>("+(solde>=0?"+":"")+m2h(solde)+")</span></td></tr></table>";
    }
    html+="</body></html>";
    var w=window.open("","_blank"); w.document.write(html); w.document.close(); w.print();
    showToast("PDF ✓");
  }

  function resetData(){ if(window.confirm("Supprimer toutes les données ?")){ setData({}); setAdjustments({}); saveAll({},settings,{}); showToast("Données effacées"); } }

  var dark=settings.theme!=="light";
  var today=new Date(),todayEntry=data[dk(today)]||{};
  var useSingle=singleToday||settings.singlePeriodDefault||todayEntry.singlePeriod;
  var nextIdx=nextMainIdx(todayEntry,useSingle);
  var crs=getMainCreneaux(PRESETS[settings.preset]||PRESETS.matinapm,useSingle);
  var nextCreneau=nextIdx>=0?crs[nextIdx]:null;
  var pIdx=nextPauseIdx(todayEntry);

  return (
    <div style={{fontFamily:"'DM Sans','Segoe UI',sans-serif",minHeight:"100vh",display:"flex",flexDirection:"column",maxWidth:480,margin:"0 auto",background:dark?"#0c0c14":"#f4f4f8",color:dark?"#e8e6f0":"#1a1a2e"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"14px 20px 12px",borderBottom:"1px solid "+(dark?"#1a1a28":"#e0e0ec")}}>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <div style={{fontSize:26}}>⏱</div>
          <div>
            <div style={{fontSize:19,fontWeight:700,letterSpacing:"-0.5px",fontStyle:"italic",color:dark?"#f0eeff":"#1a1a2e"}}>Badgeo</div>
            {settings.nom&&<div style={{fontSize:12,color:dark?"#8b86aa":"#999"}}>{settings.nom}</div>}
          </div>
        </div>
        <button style={{background:"none",border:"none",fontSize:22,cursor:"pointer",color:dark?"#8b86aa":"#aaa"}} onClick={function(){setView(function(v){return v==="settings"?"semaine":"settings";});}}>{view==="settings"?"✕":"☰"}</button>
      </div>

      {view!=="settings"&&(
        <div style={{padding:"10px 14px 10px",borderBottom:"1px solid "+(dark?"#1a1a28":"#e0e0ec")}}>
          <div style={{display:"flex",gap:8,alignItems:"stretch",marginBottom:pIdx?8:0}}>
            {nextCreneau?(
              <button onClick={handlePointage} style={{flex:1,background:dark?"linear-gradient(135deg,#1a1832,#211e3a)":"linear-gradient(135deg,#f0eeff,#e8e4ff)",border:"1.5px solid "+(dark?"#3a3260":"#c4b8ff"),borderRadius:14,padding:"11px 16px",display:"flex",alignItems:"center",gap:12,cursor:"pointer"}}>
                <span style={{fontSize:26}}>{nextCreneau.icon}</span>
                <div style={{textAlign:"left"}}>
                  <div style={{fontSize:10,fontWeight:700,textTransform:"uppercase",letterSpacing:1,color:dark?"#8b86aa":"#aaa"}}>Pointer maintenant</div>
                  <div style={{fontSize:15,fontWeight:700,marginTop:2,color:nextCreneau.color}}>{nextCreneau.label}</div>
                </div>
                <div style={{marginLeft:"auto",color:dark?"#3a3260":"#c4b8ff",fontSize:20}}>→</div>
              </button>
            ):(
              <div style={{flex:1,textAlign:"center",color:"#4ade80",fontWeight:700,padding:"14px",fontSize:15}}>✓ Journée complète</div>
            )}
            <button onClick={function(){setSingleToday(function(v){return !v;});}} title="Journée en une seule période"
              style={{background:dark?(singleToday?"#221e38":"#16162a"):(singleToday?"#ede9ff":"#f0f0f8"),border:"1.5px solid "+(singleToday?"#c4b8ff":(dark?"#2a2a3a":"#ddd")),borderRadius:12,padding:"0 13px",cursor:"pointer",fontSize:20,color:singleToday?"#c4b8ff":(dark?"#3a3260":"#ccc"),flexShrink:0}}>⏳</button>
          </div>
          {pIdx&&(
            <button onClick={handlePause} style={{width:"100%",background:dark?"#1a1a28":"#fff8f0",border:"1.5px solid "+(dark?"#2a2040":"#fde8d0"),borderRadius:12,padding:"10px 16px",display:"flex",alignItems:"center",gap:12,cursor:"pointer"}}>
              <span style={{fontSize:22}}>{pIdx==="debut"?"☕":"▶️"}</span>
              <div style={{textAlign:"left"}}>
                <div style={{fontSize:10,fontWeight:700,textTransform:"uppercase",letterSpacing:1,color:dark?"#8b86aa":"#aaa"}}>Pointer maintenant</div>
                <div style={{fontSize:14,fontWeight:700,marginTop:1,color:"#fb923c"}}>{pIdx==="debut"?"Départ pause":"Retour pause"}</div>
              </div>
              <div style={{marginLeft:"auto",color:dark?"#2a2040":"#fde8d0",fontSize:20}}>→</div>
            </button>
          )}
          {singleToday&&<div style={{fontSize:11,color:"#c4b8ff",marginTop:5,textAlign:"center"}}>⏳ Mode période unique activé</div>}
        </div>
      )}

      {flash&&(
        <div style={{margin:"10px 14px 0",borderRadius:14,padding:"12px 14px",display:"flex",alignItems:"center",gap:12,background:dark?"#161628":"#f0eeff",border:"1.5px solid "+(dark?"#3a3260":"#c4b8ff")}}>
          <span style={{fontSize:26}}>{flash.icon}</span>
          <div style={{flex:1}}>
            <div style={{fontSize:11,color:dark?"#8b86aa":"#aaa",fontWeight:700,textTransform:"uppercase",letterSpacing:.5}}>{flash.label}</div>
            <div style={{fontSize:30,fontWeight:800,color:dark?"#f0eeff":"#1a1a2e",lineHeight:1.1}}>{flash.heure}</div>
          </div>
          <button style={{background:"none",border:"1px solid "+(dark?"#3a3260":"#c4b8ff"),borderRadius:8,color:dark?"#8b86aa":"#888",padding:"6px 10px",fontSize:12,cursor:"pointer"}} onClick={function(){setEditDay(flash.dkk);setFlash(null);}}>Corriger</button>
        </div>
      )}

      {view!=="settings"&&(
        <div style={{display:"flex",borderBottom:"1px solid "+(dark?"#1a1a28":"#e0e0ec")}}>
          {[["semaine","Semaine"],["mois","Mois"],["annee","Année"]].map(function(kl){
            return <button key={kl[0]} style={{flex:1,background:"none",border:"none",padding:"11px 0",fontSize:14,cursor:"pointer",fontWeight:500,color:view===kl[0]?"#c4b8ff":(dark?"#8b86aa":"#aaa"),borderBottom:"2px solid "+(view===kl[0]?"#c4b8ff":"transparent")}} onClick={function(){setView(kl[0]);}}>{kl[1]}</button>;
          })}
        </div>
      )}

      <div style={{flex:1,overflowY:"auto",paddingBottom:24}}>
        {view==="semaine"&&<VueSemaine cur={cur} setCur={setCur} data={data} settings={settings} setEdit={setEditDay}/>}
        {view==="mois"&&<SafeView name="Mois"><VueMois cur={cur} setCur={setCur} data={data} settings={settings} setEdit={setEditDay} adjustments={adjustments} setAdjustments={setAdjustments} saveAll={saveAll}/></SafeView>}
        {view==="annee"&&<SafeView name="Année"><VueAnnee cur={cur} setCur={setCur} data={data} settings={settings} setCurAndView={setCurAndView} adjustments={adjustments}/></SafeView>}
        {view==="settings"&&<VueSettings settings={settings} updateSettings={updateSettings} exportCSV={exportCSV} exportPDF={exportPDF} exportJSON={exportJSON} importJSON={importJSON} resetData={resetData} showToast={showToast}/>}
      </div>

      {editDay&&<DayEditor dkey={editDay} data={data} settings={settings} onSave={handleSaveDay} onDelete={handleDelDay} onClose={function(){setEditDay(null);}}/>}
      {toast&&<div style={{position:"fixed",bottom:20,left:"50%",transform:"translateX(-50%)",background:dark?"#2a2a3a":"#1a1a2e",color:"#c4b8ff",padding:"9px 18px",borderRadius:20,fontSize:13,fontWeight:600,zIndex:200,whiteSpace:"nowrap"}}>{toast}</div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<Badgeo/>);
</script>
</body>
</html>
